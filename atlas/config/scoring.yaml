version: 4
scale: 0-100

verdicts:
  - BUY
  - STARTER
  - WATCH
  - AVOID
  - REDUCE

position_stages:
  0: research_only
  1: starter
  2: confirmation_add
  3: execution_add
  4: acceleration_add
  5: harvest_or_reduce

atlas_weights:
  validator_score: 0.15
  bottleneck_score: 0.12
  scarcity_score: 0.10
  rerating_score: 0.12
  inflection_catalyst_score: 0.12
  ai_strategic_infrastructure_exposure_score: 0.08
  ceo_value_score: 0.08
  ceo_founder_mode_score: 0.04
  government_tailwind_score: 0.06
  market_blindness_score: 0.06
  power_relevance_score: 0.07

risk_penalties_max_points:
  dilution_risk: 8
  execution_risk: 8
  thesis_fragility: 5

stealth_score_weights:
  ai_strategic_infrastructure_exposure: 0.20
  bottleneck_ownership: 0.20
  revenue_inflection_potential: 0.15
  market_blindness: 0.15
  ceo_execution_capital_allocation: 0.10
  balance_sheet_strength: 0.10
  asset_scarcity: 0.05
  government_tailwinds: 0.05

fiscal_transmission_weights:
  productivity_contribution: 0.16
  fiscal_priority: 0.14
  inflation_pass_through: 0.12
  interest_rate_resilience: 0.12
  implementation_speed: 0.10
  crowding_out_resilience: 0.10
  fiscal_dominance_benefit: 0.12
  deflationary_end_state: 0.14

# Mandatory Atlas filter: can this company still create attractive per-share value
# when long-duration U.S. sovereign yields are around 5% rather than near zero?
sovereign_hurdle_rate_filter:
  name: 5_percent_hurdle_rate_resilience
  benchmark_long_rate: 0.05
  stress_long_rate: 0.06
  applies_to: all_equities
  especially_required_for:
    - capacity_unlockers
    - ai_infrastructure
    - data_centers
    - utilities_and_power
    - miners_and_commodity_producers
    - leveraged_growth
    - capital_intensive_industrials
  weights:
    normalized_roic_spread_over_long_rate: 0.25
    normalized_fcf_yield_spread_over_long_rate: 0.20
    interest_coverage: 0.15
    balance_sheet_and_maturity_resilience: 0.15
    self_funded_capex_capacity: 0.10
    pricing_power_or_contract_escalators: 0.10
    refinancing_dependency: 0.05
  stress_test:
    base_long_rate: 0.05
    adverse_long_rate: 0.06
    require_positive_normalized_fcf: true
    require_no_forced_equity_raise_in_base_case: true
    require_base_case_per_share_value_creation: true
    review_horizon_months: 24
  gates:
    PASS:
      minimum_score: 75
      target_minimum_normalized_roic_spread_bps: 500
      target_minimum_interest_coverage_x: 4.0
      material_unfunded_24m_capital_gap: false
    WATCH:
      minimum_score: 55
    FAIL:
      maximum_score: 54
      verdict_cap: WATCH
  required_output:
    - current_10y_or_relevant_long_rate
    - normalized_roic_or_project_irr
    - normalized_fcf_yield
    - return_spread_over_long_rate
    - interest_coverage
    - net_debt_and_next_24m_maturities
    - capex_funding_source
    - pricing_power_or_contract_escalators
    - five_percent_rate_case
    - six_percent_rate_stress_case
    - gate_result

# Mandatory Atlas structural-capital-flow overlay: when AI or automation reduces human
# labor requirements, where does the displaced wage dollar go, and which public company
# can retain the largest durable share of it as per-share free cash flow?
labor_to_capital_transfer_filter:
  name: labor_to_capital_transfer
  applies_to: all_equities
  purpose: trace displaced labor spending through automation savings, AI/software spend, compute, power, physical infrastructure, capital returns, lower prices, taxes, and redistributed demand
  beneficiary_modes:
    - labor_substitution_margin_captor
    - ai_software_or_agent_toll_collector
    - compute_semiconductor_or_network_enabler
    - power_grid_or_energy_owner
    - data_center_land_cooling_or_physical_infrastructure_owner
    - capital_allocator_or_financial_asset_owner
    - consumer_price_deflation_beneficiary
    - redistribution_or_demand_recycler
  weights:
    labor_substitution_exposure_and_addressable_wage_pool: 0.15
    dollar_capture_directness: 0.15
    operating_leverage_and_fcf_conversion: 0.15
    scarce_input_or_tollbooth_ownership: 0.15
    pricing_power_and_resistance_to_competitive_pass_through: 0.10
    reinvestment_runway_and_per_share_capital_allocation: 0.10
    evidence_of_customer_roi_and_adoption_speed: 0.10
    end_demand_and_redistribution_resilience: 0.10
  gates:
    STRONG_CAPTURE:
      minimum_score: 75
      minimum_evidence_quality: 70
      priority_rank_boost_max_points: 5
      require_identifiable_dollar_path: true
      require_positive_per_share_fcf_path: true
    PARTIAL_CAPTURE:
      minimum_score: 55
      priority_rank_boost_max_points: 2
    WEAK_OR_LEAKAGE:
      maximum_score: 54
      priority_rank_boost_max_points: 0
  anti_double_count_rules:
    - do_not_count_same_ai_revenue_or_margin_gain_in_multiple_beneficiary_modes_without_separate_evidence
    - separate_customer_cost_savings_from_supplier_revenue_capture
    - separate_announced_automation_from_realized_headcount_or_unit_cost_change
    - do_not_assume_cost_savings_are_retained_if_competition_passes_them_to_customers
    - require_per_share_analysis_after_stock_based_compensation_dilution_and_financing
  required_output:
    - labor_pool_at_risk_or_automatable_cost_base
    - beneficiary_mode
    - displaced_dollar_path
    - direct_vs_second_order_capture
    - customer_roi_or_payback_evidence
    - expected_margin_or_fcf_conversion
    - competitive_price_pass_through_leakage
    - upstream_scarce_input_dependency
    - per_share_value_capture
    - end_demand_or_redistribution_risk
    - score
    - gate_result

confidence_bands:
  exceptional: [90, 100]
  high_conviction: [80, 89]
  promising_requires_validation: [70, 79]
  watch: [60, 69]
  insufficient_or_impaired: [0, 59]

material_change:
  core_score_delta_points: 10
  conviction_delta_points: 5
  alert_conviction_change_percent: 10
  also_trigger_on:
    - bottleneck_created_or_removed
    - downside_materially_changed
    - catalyst_advanced_or_broken
    - thesis_invalidated
    - sovereign_hurdle_rate_gate_changed
    - labor_to_capital_transfer_gate_changed
    - beneficiary_mode_changed
    - displaced_dollar_path_materially_changed

verdict_thresholds:
  BUY:
    minimum_adjusted_score: 82
    minimum_evidence_quality: 75
    maximum_aggregate_risk: 45
    minimum_sovereign_hurdle_rate_gate: PASS
  STARTER:
    minimum_adjusted_score: 72
    minimum_evidence_quality: 65
    maximum_aggregate_risk: 60
    minimum_sovereign_hurdle_rate_gate: WATCH
  WATCH:
    minimum_adjusted_score: 55
  AVOID:
    maximum_adjusted_score: 54
  REDUCE:
    thesis_or_valuation_deterioration: true

required_fields:
  - atlas_verdict
  - what_changed
  - structural_change
  - market_misunderstanding
  - beneficiary_mechanism
  - evidence_ledger
  - signal_cascade
  - scorecard
  - sovereign_hurdle_rate_filter
  - labor_to_capital_transfer_filter
  - valuation_condition
  - position_stage
  - bear_case
  - base_case
  - bull_case
  - catalyst_timeline
  - confirmation_signals
  - kill_conditions
  - next_validation_event
  - decision_journal_update
  - kill_list_update
  - final_verdict
